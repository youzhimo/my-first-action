yaml
# 工作流名称
name: Build and Push Docker Image

# 规则：当有代码推送到 main 分支时触发
on:
push:
branches: [ "main" ]

# 任务定义
jobs:
build-and-push:
runs-on: ubuntu-latest # 使用GitHub提供的免费Linux环境
steps:
# 步骤1：检出仓库代码
- name: Checkout code
uses: actions/checkout@v4
# 步骤2：登录到Docker Hub（使用我们在第二步设置的密钥）
- name: Log in to Docker Hub
uses: docker/login-action@v3
with:
username: ${{ secrets.DOCKERHUB_USERNAME }}
password: ${{ secrets.DOCKERHUB_TOKEN }}

# 步骤3：构建Docker镜并推送到Docker Hub
- name: Build and push
uses: docker/build-push-action@v5
with:
context: . # 使用当前目录作为构建上下文
push: true # 构建后执行推送
# 镜像标签格式：您的Docker Hub用户名/仓库名:latest
tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-first-action:latest
